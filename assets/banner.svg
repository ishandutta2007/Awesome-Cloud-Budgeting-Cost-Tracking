<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .animated-pulse { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .animated-wave { animation: floatWave 6s infinite ease-in-out; }
    .animated-line { stroke-dasharray: 8 4; animation: dash 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Background Grid -->
  <g stroke="url(#grid)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Background Dynamic Graph / Visualization Elements (in background, opacity lowered) -->
  <g class="animated-wave" opacity="0.35">
    <!-- Area Chart Background -->
    <path d="M 100 250 Q 250 180, 400 220 T 700 140 T 1000 170 T 1150 110 L 1150 280 L 100 280 Z" fill="url(#chartGrad)"/>
    <!-- Chart Line -->
    <path d="M 100 250 Q 250 180, 400 220 T 700 140 T 1000 170 T 1150 110" fill="none" stroke="#22c55e" stroke-width="3" filter="url(#glow)"/>
    <!-- Budget Alert Limit Line -->
    <line x1="100" y1="130" x2="1150" y2="130" stroke="#ef4444" stroke-width="2" class="animated-line" opacity="0.8"/>
    <text x="1050" y="122" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold">Budget Threshold</text>
  </g>

  <!-- Floating Dynamic Glow Orbs in Background -->
  <circle cx="950" cy="80" r="90" fill="#a855f7" filter="url(#glow)" class="animated-pulse" opacity="0.15"/>
  <circle cx="150" cy="240" r="70" fill="#06b6d4" filter="url(#glow)" class="animated-pulse" opacity="0.15"/>

  <!-- Foreground Content Container (Ensures crisp readability) -->
  <!-- Top Pill / Badge -->
  <g transform="translate(450, 40)">
    <rect width="300" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="150" y="21" text-anchor="middle" class="badge">💰 AWS • Azure • GCP • Kubernetes FinOps 📊</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <text x="600" y="135" text-anchor="middle" class="title" filter="url(#glow)">Awesome Cloud Budgeting &amp; Cost Tracking</text>
  <text x="600" y="180" text-anchor="middle" class="subtitle">Curated FinOps Directory • SaaS Cost Platforms • Open-Source Spend Optimization</text>

  <!-- Key Metric / Feature Pills Foreground -->
  <g transform="translate(240, 220)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <text x="105" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600">⚡ Unit Economics &amp; Allocation</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(245, 0)">
      <rect width="230" height="42" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" opacity="0.9"/>
      <text x="115" y="26" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="600">🛡️ Anomaly &amp; Budget Guardrails</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(495, 0)">
      <rect width="225" height="42" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
      <text x="112" y="26" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="600">🌱 Self-Hosted &amp; Open-Source</text>
    </g>
  </g>
</svg>
